[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-core"
version = "1.0.0"
description = "Shared domain library: preprocessing, datasets, models, losses, metrics and prediction for glioma segmentation."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.2",
    "nibabel==5.3.2",
]

[tool.setuptools.packages.find]
include = ["segmentation_core*"]
