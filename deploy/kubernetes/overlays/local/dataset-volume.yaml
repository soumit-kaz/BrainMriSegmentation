apiVersion: v1
kind: PersistentVolume
metadata:
  name: glioma-segmentation-brats-dataset
spec:
  capacity:
    storage: 200Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: glioma-segmentation
    name: brats-dataset
  hostPath:
    path: /run/desktop/mnt/host/c/PersonalData/Soumit/BrainMriSegmentation/data
    type: Directory
