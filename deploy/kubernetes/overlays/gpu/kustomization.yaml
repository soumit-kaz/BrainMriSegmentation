apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - nvidia-time-slicing.yaml
secretGenerator:
  - name: segmentation-secrets
    namespace: glioma-segmentation
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true
patches:
  - target:
      kind: Deployment
      name: training-service
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          nvidia.com/gpu.present: "true"
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
        value: 1
  - target:
      kind: Deployment
      name: inference-worker
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          nvidia.com/gpu.present: "true"
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
        value: 1
  - target:
      kind: Ingress
      name: glioma-segmentation
    patch: |-
      - op: add
        path: /spec/tls
        value:
          - hosts: [glioma.local]
            secretName: glioma-segmentation-tls
