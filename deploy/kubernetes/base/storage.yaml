apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brats-dataset
spec:
  accessModes: [ReadOnlyMany]
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-artifacts
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: preprocessing-cache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 60Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inference-storage
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 100Gi
