apiVersion: v1
kind: Service
metadata:
  name: training-service
spec:
  selector:
    app.kubernetes.io/name: training-service
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: training-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: training-service
    spec:
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: training-service
          image: glioma-segmentation/training-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: segmentation-configuration
          readinessProbe:
            httpGet:
              path: /api/training/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/training/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "2"
              memory: 6Gi
            limits:
              memory: 14Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: dataset
              mountPath: /data
              readOnly: true
            - name: model-artifacts
              mountPath: /artifacts
            - name: preprocessing-cache
              mountPath: /cache
            - name: temporary
              mountPath: /tmp
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: dataset
          persistentVolumeClaim:
            claimName: brats-dataset
            readOnly: true
        - name: model-artifacts
          persistentVolumeClaim:
            claimName: model-artifacts
        - name: preprocessing-cache
          persistentVolumeClaim:
            claimName: preprocessing-cache
        - name: temporary
          emptyDir: {}
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
