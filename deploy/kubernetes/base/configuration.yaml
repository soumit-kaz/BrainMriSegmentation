apiVersion: v1
kind: ConfigMap
metadata:
  name: segmentation-configuration
data:
  HOME: /tmp
  SEGMENTATION_DATASET_DIRECTORY: /data
  SEGMENTATION_ARTIFACTS_DIRECTORY: /artifacts
  SEGMENTATION_CACHE_DIRECTORY: /cache
  SEGMENTATION_DATA_LOADER_WORKER_COUNT: "4"
  INFERENCE_STORAGE_DIRECTORY: /storage
  INFERENCE_MAXIMUM_QUEUE_LENGTH: "200"
  INFERENCE_RATE_LIMIT_REQUESTS_PER_MINUTE: "30"
  INFERENCE_TRUSTED_PROXY_HOP_COUNT: "2"
  INFERENCE_JOB_RETENTION_DAYS: "30"
  INFERENCE_GPU_MEMORY_FRACTION: "0.3"
  POSTGRES_DB: segmentation
